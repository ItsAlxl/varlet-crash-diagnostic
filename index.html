<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
	<meta charset="UTF-8" />

	<title>Varlet Crash Diagnostic</title>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="Description" content="A tool to help identify the causes of Darktide crashes." />
	<meta property="og:title" content="Varlet Crash Diagnostic" />
	<meta property="og:description" content="A tool to help identify the causes of Darktide crashes." />

	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script type="module" src="/src/index"></script>
</head>

<body class="min-h-full bg-base-300">
	<div id="navbar" class="navbar bg-base-300 border-b-2 border-white/5 sticky top-0 z-100 px-4">
		<div class="flex-1 flex flex-row">
			<div class="text-2xl font-bold" data-loc-key="varlet_tool_title"></div>
			<div class="pl-2 self-end opacity-60">v0.2.1</div>
		</div>
		<div class="flex-none flex flex-row gap-2">
			<a class="btn btn-ghost btn-square" href="https://ko-fi.com/itsalxl" data-loc-tip="tip_donate">
				<span class="iconify-[tabler--tip-jar]"></span>
			</a>
			<a class="btn btn-ghost btn-square" href="https://github.com/ItsAlxl/varlet-crash-diagnostic"
				data-loc-tip="tip_source">
				<span class="iconify-[tabler--code]"></span>
			</a>
			<div id="language-menu">
				<button popovertarget="language-change" style="anchor-name:--language-change"
					class="btn btn-ghost btn-square gap-1 px-1.5 font-bold" aria-label="Language"
					data-loc-tip="tip_translate">
					<span class="iconify-[tabler--language]"></span>
					<svg class="mt-px hidden size-2 fill-current opacity-60 sm:inline-block"
						xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
						<path d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z">
						</path>
					</svg>
				</button>
				<div popover="" id="language-change" style="position-anchor:--language-change"
					class="dropdown dropdown-end bg-base-200 max-h-100 overflow-y-auto border-3 border-white/5 shadow-2xl outline-3 outline-black/5">
					<ul id="language-list" class="menu w-full"></ul>
				</div>
			</div>
		</div>
	</div>
	<div class="h-full flex flex-col p-5 gap-5">
		<div class="flex flex-col">
			<div class="collapse collapse-arrow bg-base-200 border-neutral border">
				<input type="checkbox" />
				<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
					data-loc-key="faq_about_title">
				</div>
				<div class="collapse-content flex flex-col gap-2" data-loc-key="faq_about_desc"></div>
			</div>
			<div class="collapse collapse-arrow bg-base-200 border-neutral border">
				<input type="checkbox" />
				<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
					data-loc-key="faq_log_location_title">
				</div>
				<div class="collapse-content flex flex-col gap-2">
					<div data-loc-key="faq_log_location_desc"></div>
					<div class="flex flex-col font-semibold">
						<div data-loc-key="faq_log_location_steam_title"></div>
						<div data-loc-key="faq_log_location_steam_path" class="font-mono font-normal"></div>
					</div>
					<div class="flex flex-col font-semibold">
						<div data-loc-key="faq_log_location_xbox_title"></div>
						<div data-loc-key="faq_log_location_xbox_path" class="font-mono font-normal"></div>
					</div>
					<div class="flex flex-col font-semibold">
						<div data-loc-key="faq_log_location_proton_title"></div>
						<div data-loc-key="faq_log_location_proton_path" class="font-mono font-normal"></div>
					</div>
				</div>
			</div>
			<div class="collapse collapse-arrow bg-base-200 border-neutral border">
				<input type="checkbox" />
				<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
					data-loc-key="faq_upload_title">
				</div>
				<div class="collapse-content flex flex-col gap-2" data-loc-key="faq_upload_desc"></div>
			</div>
		</div>

		<div class="flex flex-col">
			<div class="grid grow grid-cols-[1fr_75px_1fr]">
				<div class="card p-2 bg-base-100 rounded-box flex flex-col grow gap-3">
					<div class="w-full text-center text-xl font-semibold" data-loc-key="input_paste_title"></div>
					<div class="flex flex-col grow justify-center align-center gap-2">
						<textarea id="crashpaste-text"
							class="textarea textarea-bordered w-full leading-snug grow h-30 bg-base-200"
							spellcheck="false"></textarea>
						<div data-loc-key="input_paste_desc"></div>
						<fieldset class="fieldset w-full">
							<input type="file" class="file-input" id="crash-folder" webkitdirectory directory
								multiple />
							<label class="label" data-loc-key="hint_no_uploads"></label>
						</fieldset>
					</div>
					<div class="flex justify-center">
						<button class="btn btn-primary btn-outline" id="parse-crash-btn" disabled></button>
					</div>
				</div>
				<div class="divider w-full m-0 divider-horizontal" data-loc-key="hint_or"></div>
				<div class="card p-2 bg-base-100 rounded-box flex flex-col grow gap-3" id="dropzone-logfile">
					<div class="w-full text-center text-xl font-semibold" data-loc-key="input_file_title"></div>
					<div class="flex flex-col grow justify-center align-center gap-2">
						<div data-loc-key="input_file_desc"></div>
						<fieldset class="fieldset w-full">
							<input type="file" class="file-input" id="select-log" accept=".log,.txt" />
							<label class="label" data-loc-key="hint_no_uploads"></label>
						</fieldset>
					</div>
					<div class="flex justify-center">
						<button class="btn btn-primary btn-outline" id="parse-select-btn" disabled></button>
					</div>
				</div>
			</div>
		</div>

		<div class="flex flex-col gap-2 hidden" id="output-insights">
			<div class="flex flex-col">
				<div class="w-full text-center text-xl font-bold" data-loc-key="readout_insights"></div>
				<span class="text-center text-sm" id="insight-guid"></span>
			</div>
			<div class="flex flex-col" id="crash-insights"></div>
			<div class="flex flex-col" id="log-insights"></div>
		</div>

		<div class="flex flex-col gap-2 hidden" id="output-log">
			<div class="w-full text-center text-xl font-bold" id="output-name"></div>
			<div class="flex flex-col">
				<div class="collapse collapse-arrow bg-base-200 border-neutral border">
					<input type="checkbox" />
					<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
						data-loc-key="readout_callstack"></div>
					<div class="collapse-content flex flex-col gap-2">
						<div id="output-callstack">
						</div>
					</div>
				</div>
				<div class="collapse collapse-arrow bg-base-200 border-neutral border">
					<input type="checkbox" />
					<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
						data-loc-key="readout_lua_vals"></div>
					<div class="collapse-content flex flex-col gap-2">
						<div id="output-lua-vals">
						</div>
					</div>
				</div>
				<div class="collapse collapse-arrow bg-base-200 border-neutral border">
					<input type="checkbox" />
					<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
						data-loc-key="readout_load_order"></div>
					<div class="collapse-content flex flex-col gap-2">
						<ol class="list-decimal pl-8" id="output-load-order">
						</ol>
					</div>
				</div>
			</div>
		</div>

		<div class="flex flex-col gap-2 hidden" id="output-report">
			<div class="w-full text-center text-xl font-bold" data-loc-key="report_title"></div>
			<div class="flex flex-col gap-2 text-center" data-loc-key="report_desc"></div>
			<div class="flex flex-row gap-3 justify-center">
				<a class="btn btn-accent btn-outline" id="save-report-btn" data-loc-key="report_save"></a>
			</div>
			<div class="collapse collapse-arrow bg-base-200 border-neutral border">
				<input type="checkbox" />
				<div class="collapse-title font-semibold after:start-5 after:end-auto pe-4 ps-12"
					data-loc-key="report_text_title"></div>
				<div class="collapse-content flex flex-col gap-2">
					<div data-loc-key="report_text_desc"></div>
					<div>
						<button class="btn btn-primary btn-outline" id="copy-report-btn"
							data-loc-key="report_copy"></button>
					</div>
					<textarea readonly id="report-text" spellcheck="false"
						class="textarea textarea-bordered w-full leading-snug grow h-30 bg-base-200"></textarea>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
